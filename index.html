<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Shalat & Kalender Hijriah - Jakarta</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Scheherazade+New:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Variables untuk konsistensi tema */
        :root {
            --primary-gold: #f39c12;
            --bg-overlay: rgba(15, 23, 42, 0.78);
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), url('src/latar.png') center/cover no-repeat fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header Layout */
        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header-img {
            width: 80px;
            height: auto;
            margin-bottom: 1rem;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
            transition: transform 0.3s ease;
        }

        .header-img:hover {
            transform: scale(1.08) rotate(3deg);
        }

        h1 {
            font-family: 'Scheherazade New', serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.5rem;
            letter-spacing: 0.5px;
        }

        /* Badge Tanggal Masehi & Hijriah */
        .dates-wrapper {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .date-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--card-border);
            color: #ffffff;
            padding: 0.4rem 1rem;
            border-radius: 99px;
            font-size: 0.88rem;
            font-weight: 600;
            backdrop-filter: blur(8px);
        }

        .date-badge.hijri {
            background: rgba(243, 156, 18, 0.15);
            border-color: rgba(243, 156, 18, 0.4);
            color: #f1c40f;
        }

        /* Clock Card UI */
        .clock-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 1.25rem;
            text-align: center;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        #clock {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
        }

        .timezone-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Grid Jadwal Shalat */
        .grid-jadwal {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .card-sholat {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 1.25rem 1rem;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-sholat:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-4px);
            border-color: rgba(243, 156, 18, 0.5);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .card-sholat .icon {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }

        .card-sholat .label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-sholat .time {
            font-size: 1.35rem;
            font-weight: 700;
            color: #ffffff;
            margin-top: 0.25rem;
        }

        /* Footer */
        footer {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: auto;
            padding-top: 2rem;
        }

        footer a {
            color: var(--primary-gold);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        footer a:hover {
            color: #f1c40f;
            text-decoration: underline;
        }

        /* Responsif untuk Smartphone */
        @media (max-width: 600px) {
            h1 { font-size: 1.75rem; }
            #clock { font-size: 2rem; }
            .grid-jadwal { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <img class="header-img" src="https://img.icons8.com/fluency/96/ffffff/mosque.png" alt="Ikon Masjid">
            <h1>Jadwal Shalat & Waktu Ibadah</h1>
            
            <!-- Tanggal Masehi & Hijriah (Dimuat via JS) -->
            <div class="dates-wrapper">
                <div class="date-badge" id="masehi-status">
                    📅 Memuat tanggal...
                </div>
                <div class="date-badge hijri" id="ramadan-status">
                    🌙 Memuat kalender Hijriah...
                </div>
            </div>
        </header>

        <!-- Jam Digital (WIB / Jakarta) -->
        <div class="clock-card">
            <div id="clock">00:00:00</div>
            <div class="timezone-label">WIB (Waktu Indonesia Barat - Jakarta)</div>
        </div>

        <!-- Grid Waktu Shalat -->
        <div class="grid-jadwal">
            <div class="card-sholat">
                <div class="icon">🌅</div>
                <div class="label">Imsak</div>
                <div class="time" id="imsak">--:--</div>
            </div>
            <div class="card-sholat">
                <div class="icon">🏙️</div>
                <div class="label">Subuh</div>
                <div class="time" id="subuh">--:--</div>
            </div>
            <div class="card-sholat">
                <div class="icon">🌞</div>
                <div class="label">Dzuhur</div>
                <div class="time" id="dzuhur">--:--</div>
            </div>
            <div class="card-sholat">
                <div class="icon">🌤️</div>
                <div class="label">Ashar</div>
                <div class="time" id="ashar">--:--</div>
            </div>
            <div class="card-sholat">
                <div class="icon">🌇</div>
                <div class="label">Maghrib</div>
                <div class="time" id="maghrib">--:--</div>
            </div>
            <div class="card-sholat">
                <div class="icon">🌃</div>
                <div class="label">Isya</div>
                <div class="time" id="isya">--:--</div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Satria Farel Cipta Permata. All rights reserved.</p>
        <p><a href="https://linktree-sf.vercel.app" target="_blank">Kunjungi Linktree Saya</a></p>
    </footer>

    <!-- Client-Side JavaScript Logic -->
    <script>
        /**
         * Pemetaan Nama Bulan Hijriah dalam Bahasa Indonesia
         */
        const bulanHijriahIndo = {
            1: 'Muharram', 2: 'Safar', 3: 'Rabiul Awal', 4: 'Rabiul Akhir',
            5: 'Jumadil Awal', 6: 'Jumadil Akhir', 7: 'Rajab', 8: 'Sya\'ban',
            9: 'Ramadan', 10: 'Syawal', 11: 'Zulkaidah', 12: 'Zulhijah'
        };

        // ==========================================
        // 1. SERVICE WORKER & PUSH NOTIFICATION
        // ==========================================
        
        /**
         * Menginisialisasi Service Worker jika didukung browser
         */
        if ('serviceWorker' in navigator && 'PushManager' in window) {
            navigator.serviceWorker.register('service.js')
                .then(registration => initialisePush(registration))
                .catch(error => console.error('Registrasi SW gagal:', error));
        }

        /**
         * Mengelola pendaftaran Push Subscription secara aman
         */
        function initialisePush(registration) {
            // Hindari pemicuan error jika izin pernah diblokir pengguna
            if (Notification.permission === 'denied') {
                console.warn('Izin notifikasi diblokir oleh pengguna.');
                return;
            }

            registration.pushManager.getSubscription()
                .then(subscription => {
                    if (subscription) return subscription;
                    
                    const vapidPublicKey = 'BFu1SBHdqgMrmmk-HbAb6BTALVh2HMG8LYWs3FYDcHolS20KlHV8vfxpMYvGw5M9T5Ac_DLm4YWGsNYNY8kfFS4';
                    const convertedVapidKey = urlBase64ToUint8Array(vapidPublicKey);
                    
                    return registration.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: convertedVapidKey
                    });
                })
                .catch(error => console.warn('Push subscription tidak aktif:', error.message));
        }

        /**
         * Utility untuk mengonversi string VAPID Base64 ke Uint8Array
         */
        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        /**
         * Menampilkan notifikasi desktop atau fallback alert
         */
        function showNotification(title, message) {
            if (Notification.permission === "granted") {
                navigator.serviceWorker.getRegistration().then(registration => {
                    if (registration) {
                        registration.showNotification(title, {
                            body: message,
                            icon: "https://img.icons8.com/fluency/96/ffffff/mosque.png",
                            data: { url: window.location.href }
                        });
                        return;
                    }
                });
            } else {
                alert(`${title}\n${message}`);
            }
        }

        // ==========================================
        // 2. LOGIKA TANGGAL & API INTEGRATION
        // ==========================================

        /**
         * Merekam dan menampilkan Tanggal Masehi dalam format bahasa Indonesia (Asia/Jakarta)
         */
        function renderMasehiDate() {
            const now = new Date();
            const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Asia/Jakarta' };
            const dateStr = new Intl.DateTimeFormat('id-ID', options).format(now);
            document.getElementById("masehi-status").textContent = `📅 ${dateStr}`;
        }

        /**
         * Mengambil data kalender Hijriah langsung dari Aladhan API lewat Client JS
         */
        async function getHijriDate() {
            try {
                const now = new Date();
                // Mengambil tanggal lokal berdasarkan zona waktu Asia/Jakarta
                const timeOptions = { timeZone: 'Asia/Jakarta', day: '2-digit', month: '2-digit', year: 'numeric' };
                const parts = new Intl.DateTimeFormat('id-ID', timeOptions).formatToParts(now);
                
                let day = '', month = '', year = '';
                parts.forEach(p => {
                    if (p.type === 'day') day = p.value;
                    if (p.type === 'month') month = p.value;
                    if (p.type === 'year') year = p.value;
                });

                const response = await fetch(`https://api.aladhan.com/v1/gToH?date=${day}-${month}-${year}`);
                const result = await response.json();

                if (result && result.data && result.data.hijri) {
                    const hijri = result.data.hijri;
                    const hDay = parseInt(hijri.day, 10);
                    const hMonth = parseInt(hijri.month.number, 10);
                    const hYear = hijri.year;
                    const monthName = bulanHijriahIndo[hMonth] || hijri.month.en;

                    let statusText = "";
                    if (hMonth === 9) {
                        statusText = `Ramadan ke-${hDay} ${hYear} H`;
                    } else if (hMonth === 10 && hDay === 1) {
                        statusText = "Selamat Idul Fitri! Mohon maaf lahir dan batin.";
                        showNotification("Selamat Idul Fitri!", "Mohon maaf lahir dan batin.");
                    } else {
                        statusText = `${hDay} ${monthName} ${hYear} H`;
                    }

                    document.getElementById("ramadan-status").textContent = `🌙 ${statusText}`;
                }
            } catch (error) {
                console.error("Gagal mengambil data Hijriah:", error);
                document.getElementById("ramadan-status").textContent = "🌙 Gagal memuat Hijriah";
            }
        }

        /**
         * Mengambil data Jadwal Shalat Kota Jakarta dari Aladhan API
         */
        async function getPrayerTimes() {
            try {
                const response = await fetch("https://api.aladhan.com/v1/timingsByCity?city=Jakarta&country=Indonesia&method=11");
                const result = await response.json();

                if (result && result.data && result.data.timings) {
                    const t = result.data.timings;

                    document.getElementById("imsak").textContent = t.Imsak;
                    document.getElementById("subuh").textContent = t.Fajr;
                    document.getElementById("dzuhur").textContent = t.Dhuhr;
                    document.getElementById("ashar").textContent = t.Asr;
                    document.getElementById("maghrib").textContent = t.Maghrib;
                    document.getElementById("isya").textContent = t.Isha;

                    // Mengaktifkan interval pengecekan notifikasi
                    setInterval(() => checkPrayerTime(t.Imsak, t.Fajr, t.Maghrib), 1000);
                }
            } catch (error) {
                console.error("Gagal mengambil jadwal shalat:", error);
            }
        }

        /**
         * Helper: Mengonversi format "HH:mm" menjadi total menit
         */
        function timeToMinutes(timeStr) {
            if (!timeStr) return 0;
            const parts = timeStr.split(":");
            return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
        }

        /**
         * Memeriksa kesesuaian waktu saat ini (WIB) dengan jadwal shalat untuk memicu notifikasi
         */
        function checkPrayerTime(imsak, subuh, maghrib) {
            const now = new Date();
            const timeOptions = { timeZone: 'Asia/Jakarta', hour12: false, hour: '2-digit', minute: '2-digit' };
            const timeParts = new Intl.DateTimeFormat('id-ID', timeOptions).formatToParts(now);
            
            let hours = '00', minutes = '00';
            timeParts.forEach(p => {
                if (p.type === 'hour') hours = p.value;
                if (p.type === 'minute') minutes = p.value;
            });

            const currentTime = `${hours}:${minutes}`;
            const currentMinutes = parseInt(hours, 10) * 60 + parseInt(minutes, 10);

            // 1. Notifikasi Imsak (Radius mendekati 10 menit)
            const imsakMinutes = timeToMinutes(imsak);
            if (Math.abs(currentMinutes - imsakMinutes) <= 10) {
                showNotification("Waktu Imsak", "Sahur telah berakhir. Waktu imsak telah tiba.");
            }

            // 2. Notifikasi Subuh
            if (currentTime === subuh) {
                showNotification("Waktunya Sholat Subuh", "Saatnya melaksanakan sholat subuh.");
            }

            // 3. Notifikasi Maghrib / Berbuka
            if (currentTime === maghrib) {
                showNotification("Selamat Berbuka!", "Saatnya berbuka puasa 🍽️");
            }
        }

        /**
         * Mengutak-atik tampilan Jam Digital Realtime (Dikunci ke Asia/Jakarta)
         */
        function updateClock() {
            const now = new Date();
            const options = {
                timeZone: 'Asia/Jakarta',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };
            const timeString = new Intl.DateTimeFormat('id-ID', options).format(now);
            document.getElementById("clock").textContent = timeString.replace(/\./g, ':');
        }

        // ==========================================
        // 3. EKSEKUSI APLIKASI
        // ==========================================
        renderMasehiDate();
        getHijriDate();
        getPrayerTimes();
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
